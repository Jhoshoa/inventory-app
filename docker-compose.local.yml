# Stack local: el mismo docker-compose.yml de produccion (mismas imagenes, mismos
# servicios: API, web, Postgres, Supabase Auth, gateway y backup) mas Mailpit, que
# recibe todos los correos. Solo cambian los valores de .env.local.
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up --build -d --remove-orphans
#
#   Web:     http://localhost:3010
#   API:     http://localhost:8001/docs
#   Correos: http://localhost:8025
#   Postgres (psql/DBeaver): localhost:54322, usuario postgres / POSTGRES_PASSWORD
#
# No se usa en Dokploy. Diferencias con produccion: ENVIRONMENT=local (permite http
# en APP_URL y SMTP sin cifrar hacia Mailpit, y deja el login con Google solo para
# produccion), puertos publicados en 127.0.0.1 y Auth sin espera entre correos.
services:
  api:
    environment:
      ENVIRONMENT: local
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"

  web:
    ports:
      - "127.0.0.1:3010:3010"

  inventory-db:
    volumes:
      # Mismo volumen que el stack local anterior: los datos de prueba se conservan.
      - local-db-data:/var/lib/postgresql/data
      - local-db-config:/etc/postgresql-custom
    ports:
      - "127.0.0.1:54322:5432"

  inventory-auth:
    environment:
      # true salta el correo de confirmacion al crear la tienda.
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTH_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_MAX_FREQUENCY: 1s

  inventory-auth-gateway:
    ports:
      # Para la API corriendo fuera de Docker: SUPABASE_URL=http://localhost:54321.
      - "127.0.0.1:54321:8000"

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      # SMTP, para la API corriendo fuera de Docker (apps/backend/.env.example).
      - "127.0.0.1:1025:1025"

volumes:
  local-db-data:
  local-db-config:
