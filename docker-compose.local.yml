# Stack local: el mismo docker-compose.yml de produccion (mismas imagenes, mismo
# codigo, DEBUG=false) mas una copia local de lo que en produccion es Supabase:
# Postgres de Supabase + Supabase Auth (GoTrue) detras de un gateway que expone
# las mismas rutas (/auth/v1) que https://<proyecto>.supabase.co. Los correos de
# Auth (confirmacion, recuperacion de contrasena) llegan a Mailpit.
#
#   cp .env.local.example .env.local
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up --build -d
#
#   Web:     http://localhost:3010
#   API:     http://localhost:8001/docs
#   Correos: http://localhost:8025
#
# No se usa en Dokploy. Entre local y produccion solo cambia el archivo de
# variables (.env.local / .env) y ENVIRONMENT=local, que solo relaja la regla de
# produccion de exigir https en APP_URL (y deja el login con Google, que necesita
# un proyecto de Google, solo para produccion).
services:
  api:
    environment:
      ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"

  web:
    ports:
      - "127.0.0.1:3010:3010"

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./docker/local/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - local-db-data:/var/lib/postgresql/data
      - local-db-config:/etc/postgresql-custom
    ports:
      # Para conectarte con psql/DBeaver: postgres / POSTGRES_PASSWORD.
      - "127.0.0.1:54322:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # Base de los enlaces de los correos: el navegador los abre en el gateway publicado.
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Como en un proyecto nuevo de Supabase: hay que confirmar el correo (en Mailpit).
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTH_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: auth@local.test
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      # Sin usuario/clave: Mailpit no pide autenticacion y Auth no autentica sin TLS.
      GOTRUE_SMTP_SENDER_NAME: Inventory local
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Hace de https://<proyecto>.supabase.co: la API llega por SUPABASE_URL=http://supabase:8000.
  supabase:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - auth
    volumes:
      - ./docker/local/supabase-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:54321:8000"

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  local-db-data:
  local-db-config:
