name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [release/*]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Clean generated artifacts
        run: corepack pnpm clean

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Unit tests
        run: corepack pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Imagen oficial de Playwright: trae Chromium y sus librerías, sin depender de la
    # versión de Ubuntu del runner. Debe coincidir con @playwright/test en pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Clean generated artifacts
        run: corepack pnpm clean

      # Los e2e corren contra este build (`next start`, ver playwright.config.ts).
      - name: Build
        run: corepack pnpm build

      - name: E2E tests
        run: corepack pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
