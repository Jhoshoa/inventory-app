<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · POS buscar en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD8}a:hover{color:#163BA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F8FA; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; overflow: hidden; position: relative; font-feature-settings: 'tnum' 1">

  <header style="background: #FFFFFF; padding: 14px 16px 12px; border-bottom: 1px solid #E8EAEF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Vender</h1>
      <button type="button" aria-label="Sin conexión, 2 ventas por enviar. Ver detalle" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #FEDF89; background: #FFFAEB; color: #93370D; font: 700 12px Inter, sans-serif; display: flex; align-items: center; gap: 6px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #F79009"></span>Sin conexión · 2 por enviar</button>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="pos-search" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px; border: 2px solid #1F4FD8; border-radius: 14px; background: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4FD8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="pos-search" type="search" value="coca" aria-label="Buscar producto o escanear código" style="border: 0; outline: 0; flex: 1; min-width: 0; font: 600 16px Inter, sans-serif">
      </label>
      <button type="button" aria-label="Escanear con la cámara" style="width: 52px; height: 52px; border-radius: 14px; border: 0; background: #101828; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>
      </button>
    </div>
    <div style="font-size: 12px; color: #475467">Busca en los productos guardados en este equipo. Las ventas se envían al volver internet.</div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 12px 12px 160px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; color: #475467; text-transform: uppercase; letter-spacing: .05em; margin: 2px 4px">3 resultados</div>
    <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid {{r.border}}; border-radius: 16px; padding: 10px; display: flex; gap: 12px; align-items: center; opacity: {{r.opacity}}">
        <span style="width: 54px; height: 54px; border-radius: 12px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0">{{r.initials}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <strong style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</strong>
          <span style="font-size: 12px; color: #475467">{{r.code}}</span>
          <span style="display: flex; gap: 10px; font-size: 12px">
            <span style="font-weight: 700; color: {{r.stockColor}}">{{r.stock}}</span>
            <span style="color: #475467; display: inline-flex; align-items: center; gap: 3px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{r.place}}</span>
          </span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: end; gap: 6px">
          <strong style="font-size: 16px">{{r.price}}</strong>
          <button type="button" aria-label="{{r.addLabel}}" disabled="{{r.disabled}}" style="height: 40px; min-width: 64px; padding: 0 12px; border-radius: 12px; border: 0; background: {{r.btnBg}}; color: {{r.btnFg}}; font: 700 14px Inter, sans-serif">{{r.btn}}</button>
        </span>
      </div>
    </sc-for>

    <div style="margin-top: 6px; font-size: 12px; font-weight: 700; color: #475467; text-transform: uppercase; letter-spacing: .05em; margin-left: 4px">Más vendidos</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{top}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-label="Agregar {{t.name}}" style="height: 72px; border-radius: 14px; border: 1px solid #E8EAEF; background: #FFFFFF; padding: 8px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font-family: Inter, sans-serif; color: #101828">
          <span style="font-size: 12px; font-weight: 600; line-height: 1.25">{{t.name}}</span>
          <strong style="font-size: 14px">{{t.price}}</strong>
        </button>
      </sc-for>
    </div>
  </div>

  <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 104px; background: #101828; color: #FFFFFF; border-radius: 14px; padding: 0 8px 0 14px; height: 48px; display: flex; align-items: center; gap: 10px; font-size: 14px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A6F4C5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    <span style="flex: 1">Agregado: <strong>Coca Cola 2l</strong> (2)</span>
    <button type="button" style="height: 36px; padding: 0 10px; border: 0; background: transparent; color: #FFE14D; font: 700 14px Inter, sans-serif">Deshacer</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E8EAEF; padding: 10px 12px 24px; display: flex; gap: 10px">
    <a href="A-Movil-POS-Boleta.dc.html" style="flex: 1; height: 56px; border-radius: 16px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box">
      <span style="min-width: 26px; height: 26px; border-radius: 999px; background: #101828; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">5</span>
      <span style="display: flex; flex-direction: column"><strong style="font-size: 14px">Ver venta</strong><span style="font-size: 12px; color: #475467">3 productos</span></span>
    </a>
    <a href="A-Movil-POS-Cobro.dc.html" style="flex: 1.3; height: 56px; border-radius: 16px; background: #1F4FD8; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">Cobrar Bs 46,20</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#067647', low = '#B54708', out = '#B42318';
    const r = (initials, bg, fg, name, code, stock, stockColor, place, price, inCart, disabled) => ({
      initials, bg, fg, name, code, stock, stockColor, place, price,
      btn: disabled ? 'Sin stock' : inCart ? '+1 (' + inCart + ')' : 'Agregar',
      addLabel: disabled ? name + ' sin stock' : 'Agregar ' + name,
      disabled: disabled ? true : undefined,
      btnBg: disabled ? '#F2F4F7' : inCart ? '#EEF4FF' : '#1F4FD8',
      btnFg: disabled ? '#98A2B3' : inCart ? '#1F4FD8' : '#FFFFFF',
      border: inCart ? '#B2CCFF' : '#E8EAEF',
      opacity: disabled ? '0.75' : '1'
    });
    return {
      results: [
        r('CC', '#FEE4E2', '#912018', 'Coca Cola 2l', 'BEB000001', '10 u.', ok, 'Pasillo 3 · Heladera', 'Bs 14,00', '2'),
        r('CC', '#FEE4E2', '#912018', 'Coca Cola 600ml', 'BEB000006', 'Quedan 2', low, 'Heladera', 'Bs 6,00'),
        r('CZ', '#F2F4F7', '#344054', 'Coca Cola Zero 2l', 'BEB000007', 'Sin stock', out, 'Depósito', 'Bs 14,00', null, true)
      ],
      top: [
        { name: 'Pan de batalla', price: 'Bs 0,50' },
        { name: 'Leche Pil 1l', price: 'Bs 7,50' },
        { name: 'Papas Fritas 120g', price: 'Bs 6,50' }
      ]
    };
  }
}
</script>
</body>
</html>
