<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>B · Vender en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8EF; font-family: Archivo, system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 2px solid #111111; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-weight: 900; font-size: 22px; text-transform: uppercase">Vender</h1>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; border: 2px solid #111111; border-radius: 999px; padding: 4px 10px">SIN CONEXIÓN · OK</span>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="b-search" style="flex: 1; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 2px solid #111111; border-radius: 14px; background: #FBF8EF">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="b-search" type="search" placeholder="Producto o código" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font: 600 15px Archivo, sans-serif">
      </label>
      <button type="button" aria-label="Escanear con la cámara" style="width: 48px; height: 48px; border: 2px solid #111111; border-radius: 14px; background: #111111; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFE14D" stroke-width="2.4" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button type="button" style="flex-shrink: 0; height: 32px; padding: 0 12px; border: 2px solid #111111; border-radius: 999px; background: #111111; color: #FFFFFF; font: 700 13px Archivo, sans-serif">Más vendidos</button>
      <button type="button" style="flex-shrink: 0; height: 32px; padding: 0 12px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; font: 700 13px Archivo, sans-serif">Bebidas</button>
      <button type="button" style="flex-shrink: 0; height: 32px; padding: 0 12px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; font: 700 13px Archivo, sans-serif">Lácteos</button>
      <button type="button" style="flex-shrink: 0; height: 32px; padding: 0 12px; border: 2px solid #111111; border-radius: 999px; background: #FFFFFF; font: 700 13px Archivo, sans-serif">Abarrotes</button>
    </div>
  </header>

  <div style="padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; flex: 1; overflow: hidden">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
      <button type="button" aria-label="Agregar {{p.name}}" style="text-align: left; border: 2px solid #111111; border-radius: 16px; background: #FFFFFF; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-family: Archivo, sans-serif; color: #111111; position: relative">
        <span style="height: 62px; border-radius: 10px; background: {{p.bg}}; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px">{{p.initials}}</span>
        <span style="font-weight: 700; font-size: 13px; line-height: 1.25; height: 32px; overflow: hidden">{{p.name}}</span>
        <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
          <strong style="font-family: 'JetBrains Mono', monospace; font-size: 15px">{{p.price}}</strong>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #5A5446">{{p.stock}}</span>
        </span>
        <sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: -8px; right: -6px; min-width: 26px; height: 26px; border-radius: 999px; background: #FF4A1C; color: #FFFFFF; border: 2px solid #111111; font: 800 13px 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center">{{p.qty}}</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #FFE14D; border: 2px solid #111111; border-radius: 20px; box-shadow: 4px 4px 0 #111111; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace">
      <span style="font-size: 12px; font-weight: 800">BOLETA · 3 PRODUCTOS · 5 U.</span>
      <a href="#" style="font-size: 12px; font-weight: 800">VER DETALLE ↑</a>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Vaciar boleta" style="width: 52px; height: 56px; border: 2px solid #111111; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </button>
      <a href="#" style="flex: 1; height: 56px; border-radius: 14px; background: #111111; color: #FFE14D; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 900; font-size: 18px; text-transform: uppercase; box-sizing: border-box">Cobrar<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px">Bs 47,50</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      products: [
        { initials: 'CC', bg: '#FFD9CC', name: 'Coca Cola 2l', price: '14,00', stock: '12 U.', inCart: true, qty: '2' },
        { initials: 'PF', bg: '#FFE14D', name: 'Papas Fritas 120g', price: '6,50', stock: '30 U.', inCart: true, qty: '1' },
        { initials: 'LP', bg: '#D6E9FF', name: 'Leche Pil 1l', price: '7,50', stock: 'QUEDAN 2', inCart: false, qty: '' },
        { initials: 'AG', bg: '#D9F2E3', name: 'Arroz Grano de Oro 1kg', price: '12,50', stock: '59 U.', inCart: false, qty: '' },
        { initials: 'YF', bg: '#FFE0F0', name: 'Yogur Frutilla', price: '6,50', stock: '11 U.', inCart: true, qty: '2' },
        { initials: 'PB', bg: '#F1E6D2', name: 'Pan de batalla', price: '0,50', stock: '80 U.', inCart: false, qty: '' }
      ]
    };
  }
}
</script>
</body>
</html>
