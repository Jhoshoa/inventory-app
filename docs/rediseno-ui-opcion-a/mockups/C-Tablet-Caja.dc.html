<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>C · Vender en tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE14D}a:hover{color:#FFF0A3}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #0E1116; font-family: Inter, system-ui, sans-serif; color: #F2F4F7; display: flex; overflow: hidden; font-feature-settings: 'tnum' 1">

  <nav aria-label="Principal" style="width: 84px; flex-shrink: 0; background: #0A0D11; border-right: 1px solid #1F242D; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-sizing: border-box">
    <svg aria-hidden="true" viewBox="3 3 42 42" width="38" height="38" style="margin-bottom: 14px"><path d="M11 5H37Q40 5 40 8V39L36 43L32 39L28 43L24 39L20 43L16 39L12 43L8 39V8Q8 5 11 5Z" fill="#FFE14D" stroke="#0E1116" stroke-width="3" stroke-linejoin="round"></path><circle cx="19" cy="18" r="2.8" fill="#111111"></circle><circle cx="29" cy="18" r="2.8" fill="#111111"></circle><path d="M17 25Q24 31 31 25" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"></path></svg>
    <a href="#" aria-current="page" style="width: 68px; height: 62px; border-radius: 16px; background: #FFE14D; color: #0E1116; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 800">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"></path></svg>Vender</a>
    <a href="#" style="width: 68px; height: 62px; border-radius: 16px; color: #98A2B3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7L16 2l-3 2-3-2-3 2z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Ventas</a>
    <a href="#" style="width: 68px; height: 62px; border-radius: 16px; color: #98A2B3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Productos</a>
    <a href="#" style="width: 68px; height: 62px; border-radius: 16px; color: #98A2B3; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>Caja</a>
    <div style="margin-top: auto; width: 44px; height: 44px; border-radius: 50%; background: #232934; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px" aria-label="Cajero: Luis" role="img">LU</div>
  </nav>

  <section style="flex: 1; min-width: 0; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <div style="display: flex; gap: 10px">
      <label for="c-t-search" style="flex: 1; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 16px; background: #1A1F27; border: 2px solid #2B323D">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="c-t-search" type="search" placeholder="Buscar o escanear un código" style="border: 0; outline: 0; background: transparent; color: #F2F4F7; flex: 1; min-width: 0; font: 600 16px Inter, sans-serif">
      </label>
      <button type="button" style="height: 56px; padding: 0 18px; border-radius: 16px; border: 2px solid #2B323D; background: #1A1F27; color: #F2F4F7; font: 700 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFE14D" stroke-width="2.4" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>Escanear</button>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #F2F4F7; color: #0E1116; font: 800 14px Inter, sans-serif">Más vendidos</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1F27; color: #D0D5DD; font: 700 14px Inter, sans-serif">Bebidas</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1F27; color: #D0D5DD; font: 700 14px Inter, sans-serif">Lácteos</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1F27; color: #D0D5DD; font: 700 14px Inter, sans-serif">Abarrotes</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #1A1F27; color: #D0D5DD; font: 700 14px Inter, sans-serif">Limpieza</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: start; overflow: hidden">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="9">
        <button type="button" aria-label="Agregar {{p.name}}" style="text-align: left; height: 128px; border-radius: 18px; border: 2px solid {{p.border}}; background: #1A1F27; color: #F2F4F7; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; font-family: Inter, sans-serif">
          <span style="display: flex; justify-content: space-between; align-items: start; gap: 8px; width: 100%">
            <span style="font-weight: 700; font-size: 15px; line-height: 1.3">{{p.name}}</span>
            <span style="min-width: 28px; height: 28px; border-radius: 999px; background: {{p.badgeBg}}; color: #0E1116; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center">{{p.qty}}</span>
          </span>
          <span style="display: flex; justify-content: space-between; align-items: end; width: 100%">
            <strong style="font-size: 22px; font-weight: 900">{{p.price}}</strong>
            <span style="font-size: 12px; font-weight: 700; color: {{p.stockColor}}">{{p.stock}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </section>

  <aside aria-label="Boleta" style="width: 340px; flex-shrink: 0; background: #151A21; border-left: 1px solid #1F242D; display: flex; flex-direction: column; box-sizing: border-box">
    <div style="padding: 18px 18px 10px; display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 20px; font-weight: 800">Boleta</h2>
      <button type="button" style="border: 0; background: transparent; color: #98A2B3; font: 700 13px Inter, sans-serif; min-height: 44px">Vaciar</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0 18px; flex: 1; display: flex; flex-direction: column; overflow: hidden">
      <sc-for list="{{cart}}" as="c" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #232934">
          <span style="flex: 1; min-width: 0"><strong style="display: block; font-size: 15px">{{c.name}}</strong><span style="font-size: 13px; color: #98A2B3">{{c.unit}}</span></span>
          <span style="display: flex; align-items: center; gap: 6px">
            <button type="button" aria-label="Quitar uno de {{c.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #232934; color: #F2F4F7; font: 800 20px Inter, sans-serif">−</button>
            <span style="width: 22px; text-align: center; font-weight: 900; font-size: 17px">{{c.qty}}</span>
            <button type="button" aria-label="Agregar uno de {{c.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #232934; color: #F2F4F7; font: 800 20px Inter, sans-serif">+</button>
          </span>
          <strong style="width: 64px; text-align: right; font-size: 15px">{{c.total}}</strong>
        </li>
      </sc-for>
    </ul>
    <div style="padding: 16px 18px 20px; border-top: 1px solid #232934; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #98A2B3"><span>Subtotal</span><span>Bs 47,50</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 700">Total</span><span style="font-size: 34px; font-weight: 900; letter-spacing: -0.02em">Bs 47,50</span></div>
      <a href="C-Movil-Caja.dc.html" style="height: 64px; border-radius: 18px; background: #FFE14D; color: #0E1116; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 19px">Cobrar Bs 47,50</a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, price, stock, qty, warn) => ({
      name, price, stock,
      qty: qty || '',
      badgeBg: qty ? '#FFE14D' : 'transparent',
      border: qty ? '#FFE14D' : '#1A1F27',
      stockColor: warn ? '#FF8A4C' : '#98A2B3'
    });
    return {
      products: [
        p('Coca Cola 2l', '14,00', '12 u.', '2'),
        p('Papas Fritas 120g', '6,50', '30 u.', '1'),
        p('Yogur Frutilla', '6,50', 'vence 13/11', '2', true),
        p('Leche Pil 1l', '7,50', 'quedan 2', '', true),
        p('Arroz Grano de Oro 1kg', '12,50', '59 u.'),
        p('Pan de batalla', '0,50', '80 u.'),
        p('Aceite Fino 1l', '18,00', '40 u.'),
        p('Cerveza Paceña 620ml', '15,00', '48 u.'),
        p('Detergente en Polvo 1kg', '22,00', '24 u.')
      ],
      cart: [
        { name: 'Coca Cola 2l', unit: 'Bs 14,00 c/u', qty: '2', total: '28,00' },
        { name: 'Papas Fritas 120g', unit: 'Bs 6,50 c/u', qty: '1', total: '6,50' },
        { name: 'Yogur Frutilla', unit: 'Bs 6,50 c/u · lote 13/11', qty: '2', total: '13,00' }
      ]
    };
  }
}
</script>
</body>
</html>
