<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · POS venta actual en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD8}a:hover{color:#163BA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5D6470; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-feature-settings: 'tnum' 1">

  <section role="dialog" aria-labelledby="boleta-title" style="background: #FFFFFF; border-radius: 24px 24px 0 0; max-height: 92%; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #D0D5DD"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px">
      <div>
        <h2 id="boleta-title" style="margin: 0; font-size: 20px; font-weight: 800">Venta actual</h2>
        <div style="font-size: 13px; color: #475467">3 productos · 5 unidades</div>
      </div>
      <div style="display: flex; gap: 4px">
        <button type="button" style="height: 40px; padding: 0 10px; border: 0; background: transparent; color: #B42318; font: 600 14px Inter, sans-serif">Vaciar</button>
        <a href="A-Movil-POS-Buscar.dc.html" aria-label="Cerrar venta actual" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F4F7; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </a>
      </div>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <li style="padding: 12px 0; border-top: 1px solid #F2F4F7; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; gap: 10px; align-items: start">
            <span style="flex: 1; min-width: 0"><strong style="display: block; font-size: 15px">{{l.name}}</strong><span style="font-size: 12px; color: #475467">{{l.unit}}</span></span>
            <strong style="font-size: 15px">{{l.total}}</strong>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div role="group" aria-label="Cantidad de {{l.name}}" style="display: flex; align-items: center; border: 1px solid #D0D5DD; border-radius: 12px; overflow: hidden">
              <button type="button" aria-label="Quitar uno" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: 700 20px Inter, sans-serif; color: #101828">−</button>
              <input aria-label="Cantidad" value="{{l.qty}}" inputmode="numeric" style="width: 44px; height: 44px; border: 0; border-left: 1px solid #E8EAEF; border-right: 1px solid #E8EAEF; text-align: center; font: 700 16px Inter, sans-serif">
              <button type="button" aria-label="Agregar uno" disabled="{{l.atMax}}" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: 700 20px Inter, sans-serif; color: {{l.plusColor}}">+</button>
            </div>
            <button type="button" aria-label="Quitar {{l.name}} de la venta" style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #475467; font: 600 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>Quitar</button>
          </div>
          <sc-if value="{{l.conflict}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 10px; background: #FFFAEB; border: 1px solid #FEDF89; border-radius: 12px; padding: 10px 12px">
              <span style="flex: 1; font-size: 13px; color: #93370D">El stock cambió: quedan <strong>1</strong> y llevas 2.</span>
              <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #F79009; background: #FFFFFF; color: #93370D; font: 700 13px Inter, sans-serif">Ajustar a 1</button>
            </div>
          </sc-if>
        </li>
      </sc-for>
    </ul>

    <div style="margin-top: 6px; padding: 12px 16px; background: #F9FAFB; border-top: 1px solid #E8EAEF; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <div style="display: flex; justify-content: space-between; color: #475467"><span>Subtotal</span><span>Bs 47,50</span></div>
      <div style="display: flex; justify-content: space-between; color: #067647"><span>Descuento de producto disponible</span><span>− Bs 1,30</span></div>
    </div>

    <div style="padding: 12px 16px 26px; display: flex; gap: 10px; align-items: center">
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #475467">Total</span><strong style="font-size: 24px; letter-spacing: -0.02em">Bs 46,20</strong></span>
      <a href="A-Movil-POS-Cobro.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #1F4FD8; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">Ir a cobrar</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const line = (name, unit, qty, total, atMax, conflict) => ({
      name, unit, qty, total, atMax: atMax ? true : undefined, plusColor: atMax ? '#D0D5DD' : '#101828', conflict: !!conflict
    });
    return {
      lines: [
        line('Coca Cola 2l', 'Bs 14,00 c/u · stock 10', '2', 'Bs 28,00'),
        line('Papas Fritas 120g', 'Bs 6,50 c/u · stock 30', '1', 'Bs 6,50'),
        line('Yogur Frutilla', 'Bs 6,50 c/u · −10% hasta el viernes', '2', 'Bs 13,00', true, true)
      ]
    };
  }
}
</script>
</body>
</html>
