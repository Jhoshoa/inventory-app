<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · POS cobro en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD8}a:hover{color:#163BA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F8FA; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; overflow: hidden; position: relative; font-feature-settings: 'tnum' 1">

  <header style="background: #FFFFFF; padding: 12px; border-bottom: 1px solid #E8EAEF; display: flex; align-items: center; gap: 6px">
    <a href="A-Movil-POS-Boleta.dc.html" aria-label="Volver a la venta actual" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1">
      <h1 style="margin: 0; font-size: 19px; font-weight: 800">Cobrar</h1>
      <div style="font-size: 12px; color: #475467">3 productos · 5 unidades</div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #067647; display: flex; align-items: center; gap: 6px; padding-right: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #12B76A"></span>En línea</span>
  </header>

  <form style="flex: 1; overflow: hidden; padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border: 1px solid #E8EAEF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <div style="display: flex; justify-content: space-between; color: #475467"><span>Subtotal</span><span>Bs 47,50</span></div>
      <div style="display: flex; justify-content: space-between; color: #067647"><span>Descuento de producto</span><span>− Bs 1,30</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #F2F4F7; padding-top: 8px; margin-top: 2px"><span style="font-weight: 700">Total a cobrar</span><strong style="font-size: 30px; letter-spacing: -0.02em">Bs 46,20</strong></div>
    </section>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 700; margin-bottom: 8px">Método de pago</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
          <label style="height: 52px; border-radius: 14px; border: 2px solid {{m.border}}; background: {{m.bg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; color: {{m.color}}">
            <input type="radio" name="metodo" checked="{{m.checked}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">{{m.label}}</label>
        </sc-for>
      </div>
    </fieldset>

    <section style="background: #FFFFFF; border: 1px solid #E8EAEF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <label for="cobro-recibido" style="font-size: 14px; font-weight: 700">Recibido en efectivo</label>
      <div style="display: flex; gap: 8px">
        <input id="cobro-recibido" inputmode="decimal" value="50,00" style="flex: 1; min-width: 0; height: 48px; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 14px; font: 700 18px Inter, sans-serif">
        <button type="button" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font: 600 14px Inter, sans-serif">Justo</button>
        <button type="button" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid #1F4FD8; background: #EEF4FF; color: #1F4FD8; font: 700 14px Inter, sans-serif">50</button>
        <button type="button" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font: 600 14px Inter, sans-serif">100</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #ECFDF3; border-radius: 12px; padding: 10px 12px"><span style="font-weight: 700; color: #067647">Cambio</span><strong style="font-size: 20px; color: #067647">Bs 3,80</strong></div>
    </section>

    <details open style="background: #FFFFFF; border: 1px solid #E8EAEF; border-radius: 16px; padding: 14px">
      <summary style="cursor: pointer; font-size: 14px; font-weight: 700; min-height: 24px">Descuento y cliente <span style="font-weight: 500; color: #475467">(opcional)</span></summary>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
        <div style="display: flex; gap: 8px">
          <select aria-label="Tipo de descuento manual" style="flex: 1.4; min-width: 0; height: 46px; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 10px; font: 14px Inter, sans-serif; background: #FFFFFF">
            <option>% (hasta 15%)</option><option>Rebaja (hasta Bs 10)</option><option>Sin descuento manual</option>
          </select>
          <input aria-label="Valor del descuento" inputmode="decimal" placeholder="Ej. 10" style="flex: 1; min-width: 0; height: 46px; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 15px Inter, sans-serif">
        </div>
        <label for="cobro-fuente" style="font-size: 13px; font-weight: 600; color: #344054">Qué descuento aplicar</label>
        <select id="cobro-fuente" style="height: 46px; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 10px; font: 14px Inter, sans-serif; background: #FFFFFF">
          <option>Automático (el que más le convenga al cliente)</option>
        </select>
        <input aria-label="Cliente" placeholder="Nombre del cliente" style="height: 46px; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 12px; font: 15px Inter, sans-serif">
      </div>
    </details>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E8EAEF; padding: 12px 16px 26px">
    <a href="A-Movil-POS-Listo.dc.html" style="height: 58px; border-radius: 16px; background: #1F4FD8; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 17px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Confirmar venta · Bs 46,20</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (label, on) => ({
      label, checked: on ? true : undefined,
      border: on ? '#1F4FD8' : '#D0D5DD', bg: on ? '#EEF4FF' : '#FFFFFF', color: on ? '#1F4FD8' : '#344054'
    });
    return { methods: [m('Efectivo', true), m('QR'), m('Transferencia'), m('Tarjeta')] };
  }
}
</script>
</body>
</html>
