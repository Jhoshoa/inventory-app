# Solo red interna de Docker: no publica puertos. Desde internet llegan unicamente
# /auth/v1/verify, /auth/v1/authorize y /auth/v1/callback, reenviados por la web
# (apps/web/next.config.ts). La API usa todo /auth/v1 por dentro.
server {
    listen 8000;
    server_tokens off;

    # DNS de Docker, consultado en cada peticion: con un proxy_pass fijo nginx
    # resuelve el nombre una sola vez al arrancar, y si Auth se reinicia con otra
    # IP el login queda en 502 hasta reiniciar el gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://inventory-auth:9999;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plantillas de correo para Auth (GOTRUE_MAILER_TEMPLATES_*).
    location /email-templates/ {
        alias /usr/share/nginx/email-templates/;
        default_type text/html;
        charset utf-8;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
