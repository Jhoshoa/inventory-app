# Solo para docker-compose.local.yml: expone Supabase Auth en /auth/v1, la misma
# ruta que usa el SDK de Supabase contra https://<proyecto>.supabase.co.
server {
    listen 8000;

    # DNS de Docker, consultado en cada peticion: con un proxy_pass fijo nginx
    # resuelve "auth" una sola vez al arrancar, y si el contenedor se reinicia
    # con otra IP el login queda en 502 hasta reiniciar el gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth:9999;

    # Plantillas de correo para Supabase Auth (GOTRUE_MAILER_TEMPLATES_*).
    location /email-templates/ {
        alias /usr/share/nginx/email-templates/;
        default_type text/html;
        charset utf-8;
    }

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
