# Solo para docker-compose.local.yml: expone Supabase Auth en /auth/v1, la misma
# ruta que usa el SDK de Supabase contra https://<proyecto>.supabase.co.
server {
    listen 8000;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
